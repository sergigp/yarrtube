schema: spec-driven

context: |
  Rust code follows the /rust-architect skill's DDD + hexagonal conventions
  (layers, naming, ports in infrastructure/, functional style)

operations:
  apply:
    guidance:
      - Invoke the /rust-architect skill and follow its conventions when implementing Rust code
      - End every task with a commit
      - |
        Walking skeleton task: create only the structure and wiring described in the task.
        Do not implement real logic yet, even if it looks trivial. If building the skeleton
        shows that design.md's types, signatures or call stack are wrong, stop and propose
        an artifact update (/opsx:update) before continuing.
      - |
        Every TDD task is exactly one red-green-refactor cycle, done in this order:
        1. RED — Write only the one test named in the task, following /rust-architect's
           testing conventions (behaviour tests drive the application entry point with
           fakes; infrastructure tests use the real dependency). Run it and confirm it FAILS
           on an assertion. A compile error or panic is not a valid red: first add whatever
           compiling stub code the test needs, then re-run until it fails on the assertion.
           If it passes immediately, the behaviour already exists: do not ask. Keep the
           test as a regression test, skip GREEN/REFACTOR, mark the task done, and list
           every such test in the final summary.
        2. GREEN — Make the smallest production-code change that makes this test pass.
           Do not add behaviour that no failing test requires yet; later tasks will drive it.
           Run the full test suite (`cargo test --locked`); everything must pass.
        3. REFACTOR — Clean up only the code touched in this cycle (duplication, naming,
           structure per /rust-architect) without changing behaviour. Re-run the full suite;
           everything must still pass. Skip this step if nothing needs cleaning.
        Then mark the task done.
      - Never write production logic before a failing test that requires it, and never
        write more than one new test per cycle.
      - |
        Run manual verifications yourself whenever possible, using scripts/run-local.sh
        and the Playwright MCP browser. Only mark a check done if you performed exactly
        what it describes and observed the expected result. Never substitute an
        equivalent action (e.g. setting textTracks mode instead of clicking the native
        CC menu) and mark it done: leave it unchecked, and in the final summary list
        what remains for the user to verify by hand and what you checked instead.

rules:
  design:
    - |
      On design.md add these sections that will be used as an overview of the design. Don't add anything else,
      we want to keep this short and simple
      ## Diagrams
      Mermaid diagrams for the human reviewer. They are drawn from the sections
      below and add nothing to them: those sections stay complete on their own.
      - `classDiagram` of the new/changed types from ## Types & Signatures and
        their relationships (ports and their implementations, ownership,
        dependencies), plus the unchanged types they touch.
      - One `sequenceDiagram` per flow in ## Call Stack, with the call
        parameters on the arrows and error paths as `alt` blocks.
      - Only when a status or lifecycle changes: a `stateDiagram-v2` of it after
        the change.
      - Only when the SQLite schema changes: an `erDiagram` of the touched tables.
      Give every diagram a title saying what it shows, as Mermaid frontmatter
      (`---` / `title: …` / `---` before the diagram type), and start the
      section with one line: "Colours: green = new, yellow = changed,
      red = removed, plain = unchanged."
      In the class, state and ER diagrams, mark what the change adds, changes or
      removes with these classes, and leave untouched elements plain
      (ER: `class <table> new`; a removed method or call gets its own red
      node linked to what replaces it):
      classDef new fill:#d4f5d4,stroke:#2e7d32
      classDef changed fill:#fff1c2,stroke:#b58900
      classDef removed fill:#f8d4d4,stroke:#c62828,stroke-dasharray:4
      In sequence diagrams, group the participants in `box` blocks by the
      same status, in this order and colour: `box rgb(212,245,212) New`,
      `box rgb(255,241,194) Changed`, `box rgb(248,212,212) Removed`,
      `box Unchanged`; omit empty boxes.
      At most ~15 nodes per diagram; split it rather than grow it.
      ## Types & Signatures
      Code blocks defining the new/changed types and method signatures only —
      no implementation bodies. Start each block with its file path as a
      comment (e.g. `// src/application/http/foo/handler.rs`). A human should
      read these in seconds and say "right" or "wrong."
      ## Call Stack
      For each main flow: what calls what, top to bottom. And what are the call parameters.
      ## Test Plan
      The ordered list of TDD cycles. Two groups, in this order:
      1. Behaviour tests (application layer: HTTP handler, event subscriber, or task),
         ordered from simplest/happy path to edge cases and errors.
      2. Infrastructure tests, one group per real adapter the change adds or changes.
      For each: test name (`it_should_...`) and what it asserts. One test = one cycle.
    - Be very concise — no prose narration, no alternatives-considered
      discussion, no rationale paragraphs, unless a decision is genuinely
      non-obvious and needs one sentence to avoid it being "fixed" later
    - Follow /rust-architect's layering and naming conventions when naming
      files, types, and methods in the contract
    - Whenever ## Types & Signatures or ## Call Stack change, update
      ## Diagrams in the same edit so they never disagree
  proposal:
    - |
      Keep `## Impact`'s text list, and below it add a Mermaid `flowchart LR`
      for the human reviewer: the modules/components the change touches, grouped by layer
      in `subgraph`s, plus the unchanged callers of anything it changes (that
      is where side effects land). Mark nodes with the same classes as design.md:
      classDef new fill:#d4f5d4,stroke:#2e7d32
      classDef changed fill:#fff1c2,stroke:#b58900
      classDef removed fill:#f8d4d4,stroke:#c62828,stroke-dasharray:4
      Leave untouched callers plain. At most ~15 nodes. Give it a title as
      Mermaid frontmatter saying what it shows and the colour legend
      (green new, yellow changed, red removed, plain unchanged callers).
  tasks:
    - |
      Structure tasks.md as a vertical slice built outside-in. Do NOT group tasks by
      layer (domain / application / infrastructure). Use exactly these sections, in order:

      ## 1. Walking skeleton
      One task that creates every type and signature from design.md's
      ## Types & Signatures, in the files it names, across all layers, wired end-to-end
      (route/subscriber/task registered, dependencies constructed in the composition root),
      plus the fakes for any new or changed ports. Bodies return trivial hardcoded values
      (e.g. `Ok(())`, empty `Vec`, `None`, a fixed response) — never `todo!()` or
      `unimplemented!()`. Done when: `cargo build` succeeds and all existing tests pass.
      No new behaviour and no new tests in this task.

      ## 2. Behaviour (TDD)
      One task per behaviour test from design.md's Test Plan, in the same order.
      Task text: the test name + the behaviour it drives. Each task is one
      red-green-refactor cycle (see apply guidance).

      ## 3. Infrastructure adapters (TDD)
      One task per infrastructure test from the Test Plan, grouped by adapter. Each
      replaces skeleton stub code in a real adapter via one red-green-refactor cycle.

      ## 4. Verification
      The fast suites: scripts/run-tests.sh --lint --web --rust.
      The slow suites (contract, end-to-end) run in CI and in /audit-change, not here;
      only when the change adds or changes e2e specs, add a task to run --e2e.
      When the change is user-visible, add a "Manual (agent)" task for the checks the
      agent can run itself: start scripts/run-local.sh --port <free port> --fresh-videos,
      seed data via the HTTP API, drive the UI with the Playwright MCP browser, assert
      concrete evidence (DOM state, network requests, screenshot), then stop the server
      and delete yarrtube.sqlite3 and the fresh videos dir.
      Add a separate "Manual (human)" task listing every check the agent cannot perform
      faithfully (native browser menus/controls, Plex/Kodi clients, real devices, visual
      judgement). Omit it only if there are none.
