schema: spec-driven

context: |
  Rust code follows the /rust-architect skill's DDD + hexagonal conventions
  (layers, naming, ports in infrastructure/, functional style)

operations:
  apply:
    guidance:
      - Invoke the /rust-architect skill and follow its conventions when implementing Rust code
      - End every task with a commit

rules:
  tasks:
    - Every behaviour change plans an application-layer behaviour test using hand-written state-based fakes
