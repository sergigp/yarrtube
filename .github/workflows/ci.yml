name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be halfway through publishing :edge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  openspec-archived:
    name: OpenSpec changes archived
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OpenSpec changes are archived
        run: |
          extra=$(find openspec/changes -mindepth 1 -maxdepth 1 ! -name archive)
          if [ -n "$extra" ]; then
            echo "Unarchived OpenSpec changes found (run 'opsx:archive' before merging):"
            echo "$extra"
            exit 1
          fi

  ci:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check web UI (typecheck, lint, test)
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

  # Every merge to main that passes CI is published as :edge +
  # :sha-<short> (see release.yml). Stable releases (:latest) are only cut by
  # pushing a vX.Y.Z tag by hand.
  edge:
    name: Publish edge image
    needs: [openspec-archived, ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      channel: edge
