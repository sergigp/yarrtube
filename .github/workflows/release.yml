name: Release

# Publishes the multi-arch image to ghcr.io. Which tags move depends on the
# channel, resolved once in `prepare` (never from `github.event_name`: inside
# a `workflow_call` that is the caller's event, `push`):
#   - release (a pushed vX.Y.Z tag): :latest, :X.Y.Z, :X.Y
#   - edge (CI, after a merge to main passes): :edge, :sha-<short>
#   - sha (a manual run, to test any ref): :sha-<short> only
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        description: Release channel to publish (only `edge` is called for)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Resolves the channel and the build metadata stamped into the binary: the
  # version it reports (the release tag, or `edge-<short sha>`) and the commit
  # it was built from.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_subject: ${{ steps.commit.outputs.subject }}
      commit_date: ${{ steps.commit.outputs.date }}
    steps:
      - name: Resolve channel
        id: channel
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -n "$INPUT_CHANNEL" ]; then
            channel="$INPUT_CHANNEL"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            channel=sha
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            channel=release
          else
            echo "Cannot resolve a release channel for $GITHUB_EVENT_NAME on $GITHUB_REF" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          if [ "$CHANNEL" = "release" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="edge-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Subject line only: build args are newline-separated.
      - name: Read commit
        id: commit
        run: |
          {
            echo "sha=$(git log -1 --format=%H)"
            echo "subject=$(git log -1 --format=%s)"
            echo "date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"

  # Each platform builds natively on its own runner (no QEMU emulation) and
  # pushes an untagged image by digest; `merge` then stitches the digests into
  # one tagged multi-arch manifest.
  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            YARRTUBE_VERSION=${{ needs.prepare.outputs.version }}
            YARRTUBE_COMMIT_SHA=${{ needs.prepare.outputs.commit_sha }}
            YARRTUBE_COMMIT_SUBJECT=${{ needs.prepare.outputs.commit_subject }}
            YARRTUBE_COMMIT_DATE=${{ needs.prepare.outputs.commit_date }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :edge only follows main's head: a build that finishes after a newer
      # merge landed publishes its :sha-<short> but leaves :edge to the newer
      # build, so :edge never moves back to an older commit.
      - name: Check edge is still main's head
        id: head
        if: needs.prepare.outputs.channel == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "move_edge=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on to $head; not moving :edge to $GITHUB_SHA"
            echo "move_edge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.channel == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.channel == 'release' }}
            type=raw,value=edge,enable=${{ steps.head.outputs.move_edge == 'true' }}
            type=sha,enable=${{ needs.prepare.outputs.channel != 'release' }}

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
